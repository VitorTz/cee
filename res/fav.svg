<!-- favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: Yellow rounded square -->
  <rect width="64" height="64" rx="14" fill="#ffcc00" />
  
  <!-- Package Box: Deep Blue Base -->
  <path 
    d="M32 14 L14 24 L14 44 L32 54 L50 44 L50 24 Z" 
    fill="#00447c" 
    stroke="#002b54" 
    stroke-width="2" 
    stroke-linejoin="round" 
  />
  
  <!-- Box Flaps and Center Line: Yellow Strokes -->
  <path 
    d="M14 24 L32 34 L50 24 M32 34 L32 54" 
    fill="none" 
    stroke="#ffcc00" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  
  <!-- Subtle top flap highlight -->
  <path 
    d="M20 20 L32 26 L44 20" 
    fill="none" 
    stroke="#f0b90b" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
